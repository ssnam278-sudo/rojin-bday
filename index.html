<!DOCTYPE html>

<style>

.btn-main:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 0 40px rgba(255,255,255,.85),0 0 90px rgba(185,167,214,.6)}
.btn-ghost{background:transparent;color:#4a4863;border-color:#8a87a3}
.btn-ghost:hover{background:rgba(74,72,99,.08);transform:translateY(-2px)}
.btn-dark{background:#4a4863;color:#fff;border-color:#4a4863}

<script>

const {useState,useEffect,useMemo,useRef} = React;
const {motion,AnimatePresence} = window.Motion;

/* ✏️ EDIT YOUR DETAILS HERE */
const CONFIG = {

/* ---------- Atmosphere ---------- */
function Sparkles({n=40}){

const ICONS={
  cal:html`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8 14h2M12 14h2M8 17h2"/></svg>`,

function Detail({icon,label,value,d}){

          <motion.p className="serif mt-5" style=${{letterSpacing:'.3em',fontSize:'.62rem',color:'#8a87a3'}} animate=${{y:[0,6,0]}} transition=${{repeat:Infinity,duration:2.2}}>ادامه ↓</motion.p>

        <div className="paper frame relative text-center rounded-3xl px-7 py-10" style=${{width:'min(92vw,430px)'}}>
          <motion.div ...${fade()} dir="rtl" lang="fa" style=${{fontFamily:'Vazirmatn,sans-serif',fontSize:'clamp(1rem,4vw,1.15rem)',lineHeight:2,color:'#3a3855'}}>

/* ---------- Music (soft synthesized, user-controlled) ---------- */
function useMusic(){
  const ref = useRef({});
  const [on,setOn] = useState(false);
  const toggle = ()=>{
    const r = ref.current;
    if(!on){
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const master = ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
      master.gain.linearRampToValueAtTime(.16,ctx.currentTime+2);
      const note=(f,t,len,v=.5)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.08);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(master);o.start(t);o.stop(t+len+.1)};
      const mel=[493.88,587.33,739.99,659.25,587.33,554.37,587.33,493.88];
      const play=()=>{const t=ctx.currentTime+.05;mel.forEach((f,i)=>{note(f,t+i*.6,1.6,.45);note(f*2,t+i*.6,.9,.08)});[123.47,185,246.94].forEach(f=>note(f,t,4.8,.35))};
      play(); r.iv=setInterval(play,4800); r.ctx=ctx; setOn(true);
    } else { clearInterval(r.iv); r.ctx&&r.ctx.close(); setOn(false); }
  };
  return [on,toggle];
}

/* ---------- App ---------- */
function App(){
  const [scene,setScene] = useState('loading');
  const [run,setRun] = useState(0);
  const [on,toggle] = useMusic();
  useEffect(()=>{ if(scene==='loading'){const t=setTimeout(()=>setScene('lake'),2600);return()=>clearTimeout(t)} },[scene,run]);
  const replay = ()=>{setRun(r=>r+1);setScene('loading')};
  return html`<div className="fixed inset-0">
    <${AnimatePresence} mode="wait">
      ${scene==='loading'&&html`<${Loading} key=${'l'+run}/>`}
      ${scene==='lake'&&html`<${LakeScene} key=${'k'+run} onOpen=${()=>setScene('envelope')}/>`}
      ${scene==='envelope'&&html`<${Envelope} key="e" onDone=${()=>setScene('invite')}/>`}
      ${scene==='invite'&&html`<${Invite} key="i" onReplay=${replay}/>`}
    <//>
    <button onClick=${toggle} aria-label="Toggle music" className="fixed z-50 serif" style=${{top:'calc(env(safe-area-inset-top,0px) + 14px)',right:14,padding:'.5rem .9rem',borderRadius:999,fontSize:'.75rem',letterSpacing:'.15em',background:'rgba(15,18,48,.55)',border:'1px solid rgba(255,255,255,.35)',color:'#f6f1ea',backdropFilter:'blur(6px)'}}>${on?'♪ MUSIC ON':'♪ MUSIC OFF'}</button>
  </div>`;
}
